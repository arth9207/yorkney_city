    <h2>Galeria</h2>
    <figure>
        <div class="vertical">
            <img src="img/galeria/cima_cidade.jpg" alt="Vista panorâmica noturna de York, com inúmeros edifícios iluminados, arranha-céus ao fundo e ruas que brilham sob um céu azul-escuro e nublado.">
            <p>foto da cidade por cima</p>
        </div>

        <div class="vertical">
            <img src="img/galeria/cinema.png" alt="Cinema York em uma movimentada rua da cidade, cercado por arranha-céus, com cartazes de filmes na fachada, pessoas caminhando e táxis passando pela avenida">
            <p>Cinema</p>
        </div>

        <div class="vertical">
            <img src="img/galeria/escola.png" alt="Universidade de York, com uma imponente construção de arquitetura clássica, árvores ao longo da calçada e estudantes caminhando pelo campus, cercado por edifícios altos sob um céu azul">
            <p>Universidade</p>
        </div>

        <div class="vertical">
            <img src="img/galeria/hotel.png" alt="York Grand Hotel em uma movimentada avenida da cidade, cercado por edifícios altos, árvores e veículos, com a entrada do metrô de York em primeiro plano e um céu azul ao fundo.">
            <p>Hotel</p>
        </div>

        <div class="vertical">
            <img src="img/galeria/livraria.png" alt="Livraria Riverside Books em uma calçada arborizada de York, com estantes repletas de livros, vitrines iluminadas e pessoas caminhando pela rua, cercada por edifícios altos.">
            <P>livraria</P>
        </div>

        <div class="vertical">
            <img src="img/galeria/cafe.png" alt="Café Le Fleur em uma rua inclinada de York, com escadarias, casas e prédios cercados por árvores, além de uma vista panorâmica dos arranha-céus e da ponte ao fundo.">
            <p>Cafeteria</p>
        </div>

        <div class="vertical">
            <img src="img/galeria/orla.png" alt="Orla de York com um calçadão à beira-mar, lojas e restaurantes, barcos atracados no porto e uma roda-gigante ao fundo, com arranha-céus sob um céu azul ensolarado.">
            <p>Orla da praia</p>
        </div>
    
        <div class="vertical">
            <img src="img/galeria/park.png" alt="Parque central de York, com fontes, áreas verdes e bancos, localizado ao lado do York City Shopping Mall, com edifícios históricos, arranha-céus e uma ponte ao fundo.">
            <p>parque</p>
        </div>

        <div class="vertical">
            <img src="img/galeria/predio_central.jpg" alt="Edifício central de York durante a noite, com uma imponente torre iluminada em tons dourados, cercada por prédios comerciais com janelas acesas sob um céu escuro e nublado.">
            <p>Maior predio da cidade</p>
        </div>

        <div class="vertical">
            <img src="img/galeria/minha_foto.png" alt="Mão segurando uma pequena flor azul diante de um céu azul, com as letras “C”, “E” e “u” em amarelo sobre a imagem.">
            <p>minha foto</p>
        </div>
    </figure>
